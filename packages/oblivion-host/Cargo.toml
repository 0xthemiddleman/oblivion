[package]
name = "oblivion-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[features]
lab-emulation = []

[dependencies]
oblivion-tor-state = { path = "../oblivion-tor-state" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vt100 = { version = "=0.18.1", default-features = false }
zeroize = "1.9.1"

[[bin]]
name = "oblivion-storage"
path = "src/main.rs"

[[bin]]
name = "oblivion-control"
path = "src/client.rs"

[[bin]]
name = "oblivion-manager"
path = "src/manager.rs"
