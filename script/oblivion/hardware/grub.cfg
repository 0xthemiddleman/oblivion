set default=0
set timeout=3
set menu_color_normal=magenta/black
set menu_color_highlight=white/magenta

menuentry 'Oblivion COLLAUDO - Alt+F2 per Wi-Fi e accesso Mac' {
    # Disable firmware crash persistence before userspace, including diagnostics.
    linux /live/vmlinuz boot=live components nopersistence noeject nonetworking ip=off ipv6.disable=1 pstore.backend=none efi_pstore.pstore_disable=1 systemd.mask=systemd-pstore.service quiet loglevel=0 systemd.show_status=false systemd.getty_auto=no console=tty1
    initrd /live/initrd.img
}
