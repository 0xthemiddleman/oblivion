set default=0
set timeout=3
set menu_color_normal=magenta/black
set menu_color_highlight=white/magenta

menuentry 'Oblivion development - manager (USB setup pending)' {
    linux /live/vmlinuz boot=live components nopersistence noeject nonetworking ip=off quiet loglevel=0 systemd.show_status=false systemd.getty_auto=no console=tty1
    initrd /live/initrd.img
}
